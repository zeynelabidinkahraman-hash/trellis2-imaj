name: imaj-kopyala
# Özel doğan ghcr paketini (trellis2) HERKESE AÇIK depodan yeni paket adına (trellis2-hazir) kayıt-içi kopyalar.
# Sebep 19.09: gh token'ında packages kapsamı yok, görünürlük API ile değiştirilemedi; açık depodan doğan paket açık olur.
on:
  workflow_dispatch:
jobs:
  kopyala:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Kayıt içi kopya (manifest yeniden etiketleme, katman indirmez)
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/trellis2-hazir:cu124-torch26 \
            ghcr.io/${{ github.repository_owner }}/trellis2:cu124-torch26
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/trellis2-hazir:cu124-torch26 | head -20
